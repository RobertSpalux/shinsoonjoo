# 매일 새벽 OSMU 콘텐츠 완전 자동화 파이프라인
# 06:00 KST (21:00 UTC) — 뉴스 수집 → Claude 멀티 문체 생성 → 사이트 자동 발행
#                        → 카드뉴스 PNG 렌더 → 네이버/블로그스팟 원고 텔레그램 전송
name: Daily OSMU Content Factory

on:
  # ⏸ 일시정지 (2026-07-20) — 금소법 사전심의 체제 전환
  # 사유: 전 게시물 게시 전 사전심의 대상(CLAUDE.md §6.2/§6.9). 팜스 동시 심사중 3건 한도로
  #       발행 처리량이 제한되는데 크론은 매일 초안을 적재해 큐가 빠지지 않는다.
  #       [2026-09-22] 한도 숫자 정정 — 2건이 아니라 **3건**이다(PAMS 화면 원문,
  #       PROGRESS.md 2026-07-29 확정: "광고심의 신청은 [심사중] 상태 기준 3건까지 신청 가능",
  #       영상은 별도 2건·보완건 제외). 크론은 그대로 꺼 둔다 — 슬롯은 robert-os 쪽
  #       content-factory/pams_slots.py 가 ad_reviews 로 세고, 생성은 구독 세션이 한다.
  # 성격: Track A 폐기가 아니라 일시정지. 심의 처리량 확보 후 아래 schedule 주석을 해제해 재개한다.
  # 재개 전까지는 workflow_dispatch 수동 실행만 사용한다.
  # schedule:
  #   - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch: # 수동 실행 버튼

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pipeline deps
        run: npm install --no-save rss-parser puppeteer @supabase/supabase-js pdf-parse@2

      - name: Collect news & generate multi-channel content
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://goodfinance.kr' }}
          NEXT_PUBLIC_SITE_URL: https://goodfinance.kr
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_ARTICLE_LIMIT: ${{ vars.DAILY_ARTICLE_LIMIT || '2' }}
        run: node scripts/collect-and-generate.mjs

      - name: Render card news images (1080x1350)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-cards.mjs

      - name: Notify card news ready
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ 오늘의 OSMU 파이프라인 완료 — 초안 생성 + 카드뉴스 생성 완료 (미발행). 인스타 업로드용 이미지는 Supabase Storage(card-news)에 있습니다." \
            > /dev/null
